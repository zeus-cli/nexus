[package]
name = "nexus-daemon"
version = "0.1.0"
edition = "2021"
description = "NEXUS Control Plane — persistent Rust daemon (service lifecycle, IPC, event fabric, security)"
license = "Proprietary"

[[bin]]
name = "nexus-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.39", features = ["full", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.39", features = ["full", "rt-multi-thread", "macros", "time"] }
tempfile = "3"

[profile.release]
opt-level = 2

[workspace]
