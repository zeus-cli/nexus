[nexus]
name = "NEXUS"
environment = "production"

# Perfil: Notebook (i3, 12GB RAM)
# Otimizado para evitar swap e garantir fluidez do frontend.

[paths]
data_dir = "data"

[logging]
level = "INFO"
json = true
max_bytes = 5242880
backup_count = 5

[events]
retention_days = 0 
dedup_window_hours = 24
max_payload_bytes = 65536
query_limit = 50 # Reduzido para evitar lags de I/O no notebook

[api]
host = "127.0.0.1"
port = 8765
token_file = "data/secrets/api_token"

[safety]
autonomy_level = 1 # Modo Assistência: permite leitura e escrita básica

[control_plane]
# T6: quando habilitado, o daemon Rust é a autoridade final de execução e o
# store SQLite de aprovações. Falha do daemon nega execução (fail-closed).
# Mantenha desabilitado até o daemon estar operacional no host.
enabled = false
socket_path = "data/run/nexus-daemon.sock"
timeout_s = 5.0

[llm]
# Orçamento de contexto reduzido para economizar RAM (evita travamentos com o browser)
max_context_tokens = 2048
failure_threshold = 3
cooldown_s = 60
max_retries = 1

[[llm.providers]]
name = "ollama-local"
kind = "ollama"
base_url = "http://127.0.0.1:11434"
models = ["nexusorbe-llama3.1:latest", "nexusorbe-llama3.2:latest"]
enabled = true
authorized = true
timeout_s = 120
input_cost_per_million = 0
output_cost_per_million = 0

[[llm.providers]]
name = "compatible-remote"
kind = "openai_compatible"
base_url = "https://api.exemplo.invalid/v1"
models = ["modelo-remoto"]
enabled = false
authorized = false
api_key_env = "NEXUS_LLM_API_KEY"

[[llm.chain]]
provider = "ollama-local"
model = "nexusorbe-llama3.1:latest"

[[llm.chain]]
provider = "ollama-local"
model = "nexusorbe-llama3.2:latest"

[[llm.chain]]
provider = "compatible-remote"
model = "modelo-remoto"
